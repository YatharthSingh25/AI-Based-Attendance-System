# alembic.ini
[alembic]
script_location = ./alembic
prepend_syspath = True
file_template = %%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d_%%(minute).2d_%%(second).2d_%%(calling_module)s

[loggers]
keys = root

[handlers]
keys = stderr

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s][%(filename)s:%(lineno)s] %(message)s

[logger_root]
level = INFO
handlers = stderr
propagate = True

[logger_alembic.handler]
level = INFO
handlers = stderr
propagate = True

[logger_alembic.env]
level = INFO
handlers = stderr
propagate = True